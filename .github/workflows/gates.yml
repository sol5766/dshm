# =============================================================================
# DSHM 门禁 · GitHub Actions
#
# 【范围】只放**不依赖真机、不依赖 HarmonyOS SDK、不依赖 Windows** 的那批门禁，跑在
#   ubuntu-latest 上。入列判据 = 「干净克隆 + 本文件里的显式准备步骤之后，真的能绿」。
#
# 【显式准备步骤只有一步】tools/place-host-app.mjs —— resfile/resources/app/ 是生成物
#   （见 .gitignore:46），assert-resfile-sync 少了它就是红，所以先同步一次。
#
# 【没有"解包核心树"这一步，因为无包可解】hostruntime/src/main/resources/resfile/ 下：
#   · 入库的只有 busybox/ 与 ohos-skills/（`git ls-tree HEAD -- entry/src/main/resources/resfile`
#     只有 6 个文件）；
#   · 核心树 zip 见 .gitignore:42、toolchain/ 见 .gitignore:44、resources/app/ 见 .gitignore:46。
#   干净克隆里 dist/core/work/ 也不存在（/dist/ 见 .gitignore:14）。"先从 zip 解出核心树"
#   这类前置要求 zip 入库 —— 它没有。所以**需要核心树的门禁在本 workflow 里不可能变绿**，
#   只能排除（逐条依据见下），而不是加一个注定失败的解包步骤。
#
# 【排除清单与依据】（依据全部来自代码，不是推测）
#   · compat-drift.mjs
#       tools/compat-drift.mjs:32-33 读 .research/protocol/contracts.json；/.research/ 见
#       .gitignore:75 ⇒ 干净克隆没有 ⇒ 同文件 :40-44 直接 exit 2。
#   · assert-fs-search-fallback.mjs
#       tools/assert-fs-search-fallback.mjs:26-27 拼出 dist/core/work/dsh-core-<ver>/…/dsh-tool-fs-search；
#       :44 readFileSync 该路径 ⇒ 干净克隆 ENOENT 崩（实测 exit 1）。
#   · check-web-fetch-jitless.mjs
#       tools/check-web-fetch-jitless.mjs:170-178 在核心树里找 @deepseek-ai/dsh-web-fetch-http；
#       :181-186 找不到即 exit 3（SKIP）—— 非零码，不能当绿。
#   · check-ptc-runtime-inproc.mjs
#       tools/check-ptc-runtime-inproc.mjs:116-128 findCoreTree()；:158-162 找不到即 exit 3。
#   · check-ptc-wiring.mjs
#       tools/check-ptc-wiring.mjs:57 需要核心树；:59-62 即 exit 3。
#   · check-core-openharmony-patches.mjs
#       tools/check-core-openharmony-patches.mjs:57 需要核心树；:235-238 即 exit 3。
#   · check-native-closure.mjs
#       tools/check-native-closure.mjs:43-47 只看 entry/build/…/libs 与 entry/libs；后者见
#       .gitignore:52 ⇒ 干净克隆两者皆无 ⇒ 同文件 :80-84 exit 2。
#   · check-plugin-toggle.mjs
#       tools/check-plugin-toggle.mjs:36 需要核心树才能起 Host ⇒ :45-48 exit 2。
#   · tools/device-acceptance.ps1（真机 / SDK / Windows 专属）
#       :27-31 是 PowerShell param 开关；:38-59 探测 hdc.exe（含 D:\Huawei\DevEco …）；
#       :25 全文只用 hdc install -r / aa force-stop / aa start —— 要真机，且是 PS 脚本。
#   · 另按同族排除：check-arkts-entry.mjs / check-layout-fixtures.mjs 等需要 DevEco / oh_modules
#     的项 —— 它们本来就不在 AGENTS.md「必跑的回归门禁」清单里。
#
# 【行尾风险，如实记录】check-ptc-ts-strip.mjs 有一条"vendor 字节数/sha256 与声明一致"的断言，
#   对象是 hostcore/plugins/dshm-ptc-runtime-inproc/lib/vendor/babel-standalone/babel.min.cjs
#   （含 4 个裸 LF）。检出时一旦发生 CRLF 转换（Windows 上 core.autocrlf=true 就会），该文件
#   变长 4 字节 ⇒ 门禁假红。ubuntu-latest 默认 core.autocrlf=false，实测检出为 3069546 B，
#   与断言声明一致。本文件**不**加"先 git config 再 checkout"的花招：同一 job 内 checkout
#   早已完成，加了也是空转。
#
# 【工作目录】check-parity / check-dead-code 用 process.cwd() 当仓库根。GitHub Actions 的
#   run 步骤默认工作目录就是仓库根（$GITHUB_WORKSPACE），因此不需要额外 cd。
# =============================================================================
name: gates

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    name: 门禁（Linux · 无真机 · 无 HarmonyOS SDK）
    runs-on: ubuntu-latest
    steps:
      # ── 检出与运行时 ─────────────────────────────────────────────────────
      # 这些脚本只用 Node 内建模块（根目录没有 package.json），不需要 npm ci。
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与端侧运行时同大版本（libnode v24）：--jitless 语义、fetch 已转正等前提一致。
          node-version: '24'

      # ── 显式准备步骤（唯一一步）──────────────────────────────────────────
      - name: 准备 · 同步 Host 入口到 resfile
        run: node tools/place-host-app.mjs

      # ── 门禁 01-12：AGENTS.md「必跑的回归门禁」里 CI 能跑的那些 ──────────
      # 每个门禁单独一步，便于在 Actions 界面上 1:1 对应到清单里的名字。
      # if: !cancelled() ⇒ 前一项红也继续跑完，一次看清全部红项；job 整体仍然失败。
      - name: 门禁 · assert-cli-shim
        if: ${{ !cancelled() }}
        run: node tools/assert-cli-shim.mjs

      - name: 门禁 · assert-resfile-sync（依赖上面的准备步骤）
        if: ${{ !cancelled() }}
        run: node tools/assert-resfile-sync.mjs

      # 2026-11-12（docs/410）：内置救援插件 entry id 与外部同名插件解耦 + 让位逻辑。
      - name: 门禁 · check-boot-rescue-id
        if: ${{ !cancelled() }}
        run: node tools/check-boot-rescue-id.mjs

      - name: 门禁 · check-ai-disclosure-scope
        if: ${{ !cancelled() }}
        run: node tools/check-ai-disclosure-scope.mjs --self-test || { result=$?; if [ "$result" -eq 2 ]; then printf '%s\n' 'SKIP / UNVERIFIED: AI production core contract unavailable'; else exit "$result"; fi; }

      # 2026-11-12：验证市场脚本求值后的真实查询行为，不将其等同于整页缩窄已修复。
      - name: 门禁 · check-market-panel-width
        if: ${{ !cancelled() }}
        run: node tools/check-market-panel-width.mjs --self-test

      # 2026-11-12：主会话输入框作用域与样式补挂、顶部避让按事件类型消费。
      - name: 门禁 · check-composer-pin
        if: ${{ !cancelled() }}
        run: node tools/check-composer-pin.mjs --self-test

      - name: 门禁 · check-phone-viewport-grid
        if: ${{ !cancelled() }}
        run: node tools/check-phone-viewport-grid.mjs --self-test

      # 原生输出为 regular-file 追加写；4MiB 软阈值治理，宿主 C++ 行为与变异测试。
      - name: 门禁 · check-node-output-bounds
        if: ${{ !cancelled() }}
        run: node tools/check-node-output-bounds.mjs --self-test

      - name: 门禁 · check-memory-host-lifecycle
        if: ${{ !cancelled() }}
        run: node tools/check-memory-host-lifecycle.mjs --self-test

      - name: 门禁 · check-guest-handle-lifecycle
        if: ${{ !cancelled() }}
        run: node tools/check-guest-handle-lifecycle.mjs --self-test

      - name: 门禁 · check-native-capture-lifecycle
        if: ${{ !cancelled() }}
        run: node tools/check-native-capture-lifecycle.mjs --self-test

      - name: 门禁 · check-desktop-startup-progress
        if: ${{ !cancelled() }}
        run: node tools/check-desktop-startup-progress.mjs --self-test

      # 2026-11-12（docs/410）：bin/dsh 按 cores/.current 选核心（含真跑两个核心目录）。
      - name: 门禁 · check-dsh-cli-current-core
        if: ${{ !cancelled() }}
        run: node tools/check-dsh-cli-current-core.mjs

      - name: 门禁 · check-parity
        if: ${{ !cancelled() }}
        run: node tools/check-parity.mjs

      - name: 门禁 · assert-exec-fix
        if: ${{ !cancelled() }}
        run: node tools/assert-exec-fix.mjs

      - name: 门禁 · assert-python-bridge
        if: ${{ !cancelled() }}
        run: node tools/assert-python-bridge.mjs

      - name: 门禁 · check-cot-translation-live（官方思考翻译端侧**真跑**；核心树不在时如实跳过）
        if: ${{ !cancelled() }}
        # 这条**需要核心树**，而 CI 的干净检出里没有它（resfile 的 core zip 不入库）。
        # 脚本在缺树时以退出码 2 结束并打印"环境受阻"，这里把它当"跳过"而不是"失败"：
        # 目的是"有树时一定跑"，不是"没树时也判绿"。真正必跑的那条是
        # check-cot-translation.mjs（纯静态，只需仓库内文件）。
        run: node tools/check-cot-translation-live.mjs --offline || [ $? -eq 2 ]

      - name: 门禁 · check-ws-self-heal（WS 升级失败后必须自动重试；带对照臂 + 连上复位场景）
        if: ${{ !cancelled() }}
        # 三端"左下角连接异常"的根因门禁（docs/335）。B1/B2/B3 证明"失败后会重试、删掉就只试一次"；
        # C1/C2/C3 证明"连上后复位退避、不残留定时器"—— 后者防的是自愈把正常连接自己打断。
        run: node tools/check-ws-self-heal.mjs

      - name: 门禁 · check-user-data-preserved（升级不得动 home/ 用户数据；带 4 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-user-data-preserved.mjs

      - name: 门禁 · check-ffmpeg-provision（随包 ffmpeg 升级失败必须保留旧版本；带对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-ffmpeg-provision.mjs

      - name: 门禁 · check-doc-refs
        if: ${{ !cancelled() }}
        run: node tools/check-doc-refs.mjs

      - name: 门禁 · check-dead-code
        if: ${{ !cancelled() }}
        run: node tools/check-dead-code.mjs

      - name: 门禁 · check-decor-button-mode（顶栏底色 ↔ 三键配色接线；带对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-decor-button-mode.mjs

      - name: 门禁 · check-skill-sync（判据是内容 sha256，不是字节数）
        if: ${{ !cancelled() }}
        run: node tools/check-skill-sync.cjs

      - name: 门禁 · check-ptc-ts-strip（纯 JS erasable-TS 擦除器 · 自带 wasm 陷阱）
        if: ${{ !cancelled() }}
        run: node tools/check-ptc-ts-strip.mjs

      - name: 门禁 · check-internal-undici（Node 内建 undici 必须被纯 JS 垫片接管 · 带对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-internal-undici.mjs

      - name: 门禁 · check-worker-jitless（worker 线程也要拿到 jitless 补齐 · 带对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-worker-jitless.mjs

      - name: 门禁 · check-market-bridge（手机档插件市场的进程内包通道 · 启用判据带对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-market-bridge.mjs

      - name: 门禁 · check-profile-pnpm-bridge（手持档「设置 → 插件」安装/卸载的进程内包通道 · 启用判据带对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-profile-pnpm-bridge.mjs

      - name: 门禁 · check-denial-hints（「被平台拒绝」的 errno 人话化 · 两份副本逐字节一致 · 带反向判据）
        if: ${{ !cancelled() }}
        run: node tools/check-denial-hints.mjs

      - name: 门禁 · check-vm-bash（手持档 guest 虚拟机 bash 通道 · 分档判据带对照臂 · 不改派面）
        if: ${{ !cancelled() }}
        run: node tools/check-vm-bash.mjs

      - name: 门禁 · check-bash-terminfo（bash/tmux wrapper 的 TERMINFO 走 etc/terminfo、TERM 可回退 xterm、三处随包归档含 xterm · 4 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-bash-terminfo.mjs && node tools/check-bash-terminfo.mjs --self-test

      - name: 门禁 · check-task-state-compat（2in1 files 根只读时兼容副本必须跳过并缓存 · 3 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-task-state-compat.mjs && node tools/check-task-state-compat.mjs --self-test

      - name: 门禁 · check-task-state-reconcile（遵循官方 turnBoundary：启动收敛残留 running / turn/end 所有 reason 置 done · 5 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-task-state-reconcile.mjs && node tools/check-task-state-reconcile.mjs --self-test

      - name: 门禁 · 专用本地模型撤除与通用API保留
        if: ${{ !cancelled() }}
        run: node tools/check-local-model-removed.mjs --self-test

      - name: 门禁 · 定向死链撤除
        if: ${{ !cancelled() }}
        run: node tools/check-targeted-residual-cleanup.mjs --self-test

      - name: 门禁 · 并发任务状态身份
        if: ${{ !cancelled() }}
        run: node tools/check-task-state-concurrency.mjs --self-test

      - name: 门禁 · guest终端生命周期回收
        if: ${{ !cancelled() }}
        run: node tools/check-guest-terminal-lifecycle.mjs

      - name: 自检 · guest终端生命周期回收
        if: ${{ !cancelled() }}
        run: node tools/check-guest-terminal-lifecycle.mjs --self-test

      - name: 门禁 · PC设置官方配色
        if: ${{ !cancelled() }}
        run: node tools/check-pc-settings-chrome.mjs --self-test

      - name: 门禁 · 启动诊断就绪后调度
        if: ${{ !cancelled() }}
        run: node tools/check-startup-work.mjs --self-test

      - name: 门禁 · 启动授权恢复等待与异常隔离
        if: ${{ !cancelled() }}
        run: node tools/check-folder-grants-startup.mjs --self-test

      - name: 门禁 · 内置核心并发安装检查
        if: ${{ !cancelled() }}
        run: node tools/check-bundled-install-singleflight.mjs --self-test

      - name: 门禁 · 共享HSP路径解析复用
        if: ${{ !cancelled() }}
        run: node tools/check-host-module-singleflight.mjs --self-test

      - name: 门禁 · check-mobile-enter（移动端裸 Enter = 换行：keyCode 兜底 / composer 兜底 / 保护与诊断 · 3 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-mobile-enter.mjs && node tools/check-mobile-enter.mjs --self-test

      - name: 门禁 · check-foldable-sidebar（单屏直板机 / 双屏三屏走桌面档 / 平板独立档不动 · 6 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-foldable-sidebar.mjs && node tools/check-foldable-sidebar.mjs --self-test

      - name: 门禁 · check-host-vm-graceful-stop（P0-1 宿主停止必须等 VM QMP 优雅关机 · 12 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-host-vm-graceful-stop.mjs && node tools/check-host-vm-graceful-stop.mjs --self-test

      - name: 门禁 · check-skill-single-source（P0-4 内置技能文档单源到 HSP · 7 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-skill-single-source.mjs && node tools/check-skill-single-source.mjs --self-test

      - name: 门禁 · check-dual-shell-parity（P0-2 防漂移：双壳 7 个纯共享文件逐字节一致 · 4 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-dual-shell-parity.mjs && node tools/check-dual-shell-parity.mjs --self-test

      - name: 门禁 · check-tools-syntax（tools/ 脚本 shebang 位置 + node --check 全量 · 含真跑对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-tools-syntax.mjs && node tools/check-tools-syntax.mjs --self-test

      - name: 门禁 · check-vm-memory-tier（12G 保持低占用 / 16G+ 三端性能档 · 预热与覆盖面）
        if: ${{ !cancelled() }}
        run: node tools/check-vm-memory-tier.mjs

      - name: 门禁 · check-edge-desktop-policy（MatePad Edge / QXS-* 永久 desktop · 终端只走原生 · bash 仍可用 guest）
        if: ${{ !cancelled() }}
        run: node tools/check-edge-desktop-policy.mjs

      - name: 门禁 · check-fs-fence（文件访问范围闸门：沙箱 ∪ 用户目录 · 三个入口一份判据 · 带三条负控制）
        if: ${{ !cancelled() }}
        run: node tools/check-fs-fence.mjs

      - name: 门禁 · check-handheld-back（手持档「返回 / 手势」分层消费 · 绝不吞返回 · PC 逐字不动 · 带三条对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-handheld-back.mjs

      - name: 门禁 · check-boot-rescue（随包启动救援：核心树清单 + profile 默认启用 + tapIndex 注入 · 插件崩了也能卸载问题插件）
        if: ${{ !cancelled() }}
        run: node tools/check-boot-rescue.mjs

      - name: 门禁 · check-sidebar-shim-css（侧栏垫片注入的样式表必须括号配平 · 桌面档规则必须在顶层 · 手持档抽屉那条不许被搬走 · 带 4 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-sidebar-shim-css.mjs

      - name: 门禁 · check-phone-sidebar-core-compat（手机端侧栏对 0.2.2-rc.1 的 opener/inert 适配 · 恢复 1.1.7 单按钮可点 · 平板端不动 · 带 5 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-phone-sidebar-core-compat.mjs

      - name: 门禁 · check-web-glass-skin（外壳玻璃：三个面 / 顶栏与输入框不得打标 / 页面采样深浅 / 特性探针 / 实色降级 / 诊断桥 / CSS 括号 · 带 8 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-web-glass-skin.mjs && node tools/check-web-glass-skin.mjs --self-test

      - name: 门禁 · check-brand-surface（DSHM 独立品牌 · 无鲸鱼/官方文案 · MIT 与第三方声明随包 · 带 3 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-brand-surface.mjs

      - name: 门禁 · check-deveco-paths（tools/ 下不许写死 DevEco Studio 安装根 · 带 4 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-deveco-paths.mjs

      - name: 门禁 · check-plugin-render-arity（插件 output.render 必须两参 (args, value) —— 框架真实调用形状 · 带 2 组合成对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-plugin-render-arity.mjs

      - name: 门禁 · check-open-link-bridge（外开桥三侧接线：Host 端点 / ArkTS 队列 / 插件拉起调用逐字一致 · 带 4 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-open-link-bridge.mjs

      - name: 门禁 · check-browser-autoclose（任务结束自动关闭浏览器：turn/end 订阅 + 多标签只删自己页/单标签只最小化 · 带 6 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-browser-autoclose.mjs

      - name: 门禁 · check-usage-card（桌面卡片：会话进度 + 余额 + 四档用量条形图 + 白底 + 仅主应用运行时推送 · 带 9 个变异体）
        if: ${{ !cancelled() }}
        run: node tools/check-usage-card.mjs

      - name: 门禁 · check-fetch-shim（垫片本身 · 含请求方向流式体 ⑧′ 与「吞体的旧实现必须判红」⑧″ 对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-fetch-shim.cjs

      - name: 门禁 · check-permission-surface（权限面与当前声明顺序和reason一致）
        if: ${{ !cancelled() }}
        run: node tools/check-permission-surface.mjs

      - name: 门禁 · check-no-apk-surface（包内无 apk 目录 / 文件 / 归档条目 · 带 4 个变异体 + 1 条对照臂）
        if: ${{ !cancelled() }}
        run: node tools/check-no-apk-surface.mjs

