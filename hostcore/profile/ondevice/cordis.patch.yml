# ④b 语音输入（实验 bundle）：端侧策略（2026-09-26 修订）
#
#    【历史】报告 5 §2.5 / 报告 7 §3 曾把整条链**默认禁用**（四行 disabled: true），
#    因为点语音会红字报 `Local speech is unavailable for openharmony-arm64`。
#    三条平台缺口至今未变：
#      ① `dsh-experimental-speech-to-text-sensevoice` 的 `resolveRuntime()` 白名单只有
#         `darwin-arm64/x64`、`linux-arm64/x64`、`win32-x64`，**没有 openharmony**
#         （lib/index.js:201-207 逐字可见）⇒ 直接抛 "unavailable for …"；
#      ② 它依赖 `sherpa-onnx-node`，而该包在端侧**没有任何 .node/.so** 产物
#         （需要 `sherpa-onnx-openharmony-arm64`，上游不存在）；
#      ③ 即便补上产物，`.node` 还要过签名域（与本项目 git/rg 同一条约束），
#         且模型是 int8 228MB / fp32 894MB。
#
#    【2026-09-26 为什么改为启用】目标是验证**麦克风授权通路**（模块权限 +
#    WebView onPermissionRequest），而不是本地识别。读了上游代码确认"启用不会毁启动"：
#      · `sensevoice` 的 `apply()`（lib/index.js:920-954）**不调** resolveRuntime，
#        只做路径校验 + 注册 provider 元信息 + `worker.inspect()`；
#      · `inspect()`（:632-663）把 inspectRuntime 的异常**吞进** env，最终 publish
#        成 `phase: "failed"`，不冒泡 ⇒ **开机不会因它失败**；
#      · `ui-voice-input` 的 inject 是 `["remote","slots","locale","pluginNavigation"]`,
#        **不含 speechToText** ⇒ UI 正常渲染，只是按钮处于"待配置"态。
#    UI 侧（client.js）的行为已核实：provider 不可用时点麦克风**只弹配置对话框**
#    （`start()` 首行 `if (!catalog || !usable …) return;`，:5036；onClick 分支 :5090），
#    不会触发 getUserMedia ⇒ 因此本项的麦克风验证**不依赖**它，改由
#    WebApp.ets 的「应用 → 麦克风自检」独立探针完成（见 MIC_PROBE_JS 注释）。
#
#    【代价】插件面板会列出语音组件；点麦克风会弹"需安装依赖"引导（预期行为，
#    不是新 bug）。若只想保持界面干净，把这四行恢复 disabled: true 即可回退。
#
#    【2026-09-26 改为：把 sensevoice 的识别服务换成 HMOS 系统语音识别】
#    目标形态与官方一致：点官方那个麦克风按钮就能说话、识别、出字。
#
#    【为什么"改现有插件"而不是"新增一个 provider 插件"】真机实测否掉了后者：
#    loader 解析裸包名要经过一张**由 bundle 依赖闭包构成的包表**
#      真机读数：speech-to-text-stub (@deepseek-ai/dsh-speech-to-text-stub): failed to import
#    对照：`@deepseek-ai/dsh-host-directory-picker-browse` 能解析，因为它 ⊂ dsh-web-app
#    的 dependencies。新增的包不在任何闭包里 ⇒ 无解析路径。
#    而本行（speech-to-text-sensevoice）已在 `dsh-experimental-voice-input-bundle`
#    的 dependencies 内、profile 也已有它的行 ⇒ **替换其实现无需任何新接线**：
#      · provider id 仍用 `config.providerId`（= `sensevoice-local`）
#        ⇒ bundle 里 `speech-to-text` 行的 `defaultProvider: sensevoice-local` 无需改；
#      · 替换动作在打包期由 `tools/pack-core.mjs` 的 patchSensevoiceForHms() 完成
#        （把 apply 换成 hmsApply），**profile 这一层不用动**。
#
#    【为什么这样按钮就会变可点】官方 UI 的门是
#      usable = readiness.connected && provider.preparation.phase ∈ {ready, standby, waking}
#    而服务端 snapshot() 写的是
#      preparation: provider.preparation?.snapshot() ?? { phase: "ready" }
#    ⇒ HMS provider **不提供 preparation** ⇒ 被报成 ready ⇒ 按钮可用。
#    SenseVoice 恰恰因鸿蒙不在其平台白名单（lib/index.js:201-207）而永远进不了
#    ready —— 这就是"点语音按钮只会跳设置"的根因。
- id: speech-to-text
  config:
    # 【defaultProvider 必须在这里重复写一遍】本文件的覆盖是**整块替换** config
    # （见本文件开头第 8 行的纪律说明；实现是 dsh-app-boot 的
    #  `applyEntryPatches`：`target[key] = value`，逐键赋值整个 config 对象）。
    # 所以只写 language 会把 bundle 里设的 defaultProvider 抹掉 ⇒ 必须一并写出。
    defaultProvider: sensevoice-local
    # 【language 必须钉成 zh-CN】服务 config 的 language **默认是 "auto"**，
    # 而服务端 `selectedProvider()`（lib/index.js:135）会校验
    #   `provider.info.languages.includes(language)`
    # HMS 的真实能力只有 zh-CN（真机 `listLanguages()` 只返回 ["zh-CN"]），
    # 所以 provider 只声明 zh-CN ⇒ 用默认 "auto" 会报真机见过的错：
    #   Speech provider sensevoice-local does not support language: auto
    # 该字段用户可在设置页改（"识别语言"下拉，选项来自 provider.info.languages），
    # 因而合法值就是 zh-CN。
    language: zh-CN
- id: speech-to-text-sensevoice
- id: api-speech-to-text
- id: ui-voice-input

