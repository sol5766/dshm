# ⑦ 删除/移动/发布文件（DSHM 自带插件，2026-10-03）
#
#    【缺口】dsh 的 fs 契约（@deepseek-ai/dsh-fs）没有删除/移动方法——抽象类
#    FileSystem 只有 resolve/stat/lstat/readText/streamText/readBytes/readByteRange/
#    listDir/watch/writeText/editText，策略事件也只有 fs/write-intent、
#    fs/edit-intent、fs/observed（没有删除意图槽）。后端 @deepseek-ai/dsh-fs-local
#    自己 import 了 rm/rename（lib/index.js:10），即"能删"在实现层存在，但**模型
#    可见的工具集里没有**（只有 read/write/edit/glob/grep）。bash 路线已死（真机证据：
#    无可 exec 的 shell，见 ⑤ 的"手机档内不生效"）⇒ 这是唯一缺口。于是随核心树分发
#    一个自带插件 `@deepseek-ai/dshm-tool-fs-remove`（源码
#    hostcore/plugins/dshm-tool-fs-remove/，由 tools/pack-core.mjs 的
#    embedDshmToolPackages() 放进核心树 node_modules）。
#
#    【同一个缺口还缺“复制”】正常路径下工作区**就是**用户可见的
#    `Download/<包名>/`（ArkTS 认领 + 登记，见 ⑧；写入走 ⑩ 的后端），agent 直接写即可。
#    但认领失败/探写不过时工作区会回退到沙箱 `<files>/workspace`，成品用户看不见；
#    把成品搬出去需要一个复制动作，而端侧**没有 cp**、也没有可用的 shell，
#    `ctx.fs` 同样没有复制方法 ⇒ 本插件的第三个工具 `publish(source, target?)`：
#    把沙箱里的**一个文件按字节**写进用户可见下载目录，返回最终绝对路径供 agent
#    告知用户。目标根只认 `DSHM_PUBLIC_DOWNLOAD`（ArkTS 认领后传入、Host 启动期已
#    lstat + 探写验证过；见 hostcore/app/main.js 的 resolveWorkspaceDir()）——
#    env 为空时**如实报错**，不拼路径、不退到进程 cwd（那会静默写错地方）。
#    落盘用与 ⑩ 同源的去 chmod 原语：**同目录隐藏临时文件 `.partial` → `open('w'[,mode])`
#    → `writeFile(Buffer)` → `sync` → `close` → `rename` 发布**（`rename` 只用于**同一目录内**
#    改名，端侧实测放行；见 `dshm-tool-fs-remove/lib/index.js` 文件头与
#    `dshm-fs-write-nonchmod/lib/fsio-nochmod.js:22-33`）。**不用** chmod（实测 EPERM）/ link（沙箱禁）。
#    【2026-10-05 更正】本节原先写"不用 rename（未证实）…就地写**非原子**（失败后把半截文件
#    unlink 掉）"——那是本插件的**早期版本**形态；现版本已改为 `.partial` + `rename`，即
#    **原子发布**，与 ⑩ 完全同源。残留的真实语义差异见 ⑩ 的"语义差异"清单。
#
#    【写法照抄先例】与本节 :298-303 的两条 `insert:` 逐字同形——applyEntryPatches
#    的普通 patch 行是"按 id 更新已有条目"，id 不存在时只 warn 后跳过；新增行必须
#    用 `insert:`。先例注释见 :294-297。
#
#    【为什么是本层而不是 preset】preset 的 plugins 列表在 isolate 作用域内，profile
#    的 patch 行按 id 够不着（见本文件 :183-186 的同一条教训）。本行挂在**部署层**，
#    而 `tools` 是 host+per-scope 分层注册表，部署层注册进 global 层、每个 agent 读
#    "自己作用域链选出的合并目录"，所以模型可见（dsh-web-app/cordis.patch.yml:455-470
#    关掉根层 tool-fs/tool-fs-search/tool-jobs 的理由正是"preset 接管"，反过来证明
#    根层注册本来是可见的）。
#
#    【决定记录：工具层完全不设限】（2026-10-03，按用户明确要求）
#    插件**不做任何路径范围判断、不做确认/审批握手、不接 approval 服务**：绝对路径、
#    会话 cwd 之外的路径一律照常执行；工具层唯一保留的失败是"相对路径 + 会话无 cwd
#    ⇒ 无法解析"（这是语义必需的解析，不是范围判断），以及 `publish` 的"目标根缺失"
#    （它不是范围判断，而是"没有可写的用户可见目录"这一事实）。
#    唯一的闸门在**操作系统的路径授权**：端侧 sandbox-policy = danger-full-access 且
#    permission-presets 的 danger-full-access ⇒ approval = never（见 :157-168）——
#    即工具层没有任何闸门，某个路径能不能删/写由 OS 按包名/沙箱归属裁定，插件把 OS 的
#    错误原样上报（真机实测：自己包名目录内可删，其余用户目录被 OS 拒绝）。
#    这不是上游语义，是本端的决定。**可追溯的后果**：在本端当前配置下
#    （danger-full-access + approval = never），remove/move/publish 在工具层没有任何
#    闸门，模型的删除/覆盖意图只受 OS 授权约束，没有"先问一句"的机会。
#
#    【恢复条件】上游 @deepseek-ai/dsh-fs 若提供 remove/rename/copy，改插件的实现即可，
#    本行不用动；若要整条摘掉：删掉本行 + pack-core 的 embedDshmToolPackages()。
- insert:
    - id: tool-fs-remove
      name: '@deepseek-ai/dshm-tool-fs-remove'

# ⑧ 默认工作区的"登记"（DSHM 自带插件，2026-10-03）
#
#    【缺口】本端"新建会话落在哪个目录"由客户端决定，官方 Web UI
#    （@deepseek-ai/dsh-client-ui-workspace/lib/client.js，逐行核对）的顺序是：
#      · restoreSelection(:927-947)：saved.sessionId 还在 ⇒ 用它的工作区，否则
#        target = workspace?.workspaceId ?? recentWorkspace(items, byId)；
#      · startSession(:849-862)：target = workspaceId ?? currentWorkspaceId ?? recent；
#      · recentWorkspace(:1014-1030)：取"该工作区下会话最新 updatedAt；无会话时取
#        workspace.createdAt"**最新**的那一条。
#    ⇒ **注册表里最新的一条**就是默认工作区。历史经 picker 选过的
#    `Download/com.example.dshprobe` 已经持久化在注册表（`$DSH_HOME`，el2，覆盖安装不清），
#    真机的新会话 cwd 因此会落在那里（而不是本应用认领的目录）。
#
#    【官方的默认工作区为什么救不了】`dsh-workspace` 的 initializeDefault()
#    (lib/index.js:423-443) 要求「注册表空 + 归档集空 + 会话历史空」，设备上有历史 ⇒
#    返回 undefined；而它的目录来源 defaultWorkspaceDirectory()
#    (dsh-api-workspace-controller/lib/index.js:609-641) 在 openharmony 落到
#    `default: throw` 分支。两条都堵死 ⇒ 只能由本端在启动期登记一次。
#
#    【本行做什么】插件把 ArkTS 认领到的 `Download/<包名>/`
#    （env `DSHM_PUBLIC_DOWNLOAD`，见 hostruntime 的 buildHostEnv / NodeRuntime）经
#    官方 API `workspaceRegistry.create()` 登记进注册表 ⇒ 它成为最新一条 ⇒ 客户端
#    默认工作区就是用户可见目录。create() 幂等（已登记则只解析，不新增行）。
#
#    【边界】① 不改上游 dsh；② 不新增权限；③ 不删/不改任何既有目录与既有登记
#    （用户仍可在 UI 里自行删除历史工作区）；④ **绝不阻断启动**：apply() 同步返回，
#    登记是自行吞错的浮空 promise，失败只打一行日志；⑤ 没有 DSHM_PUBLIC_DOWNLOAD
#    时完全惰性（其它部署零副作用）。
#
#    【恢复条件】上游若给"默认工作区"提供不依赖空历史的配置（或
#    defaultWorkspaceDirectory 支持 openharmony），删掉本行 + pack-core 的
#    DSHM_PLUGIN_PACKAGES 里那一项即可。
#
#    ⚠ **2026-10-03 43 号修正（真机实证）**：上面"注册表里最新的一条就是默认工作区"
#    只对**兜底分支**成立。官方 Web UI 的完整顺序是
#      `startSession()`（client.js:846-859）：`target = workspaceId ?? currentWorkspaceId ?? recent`
#    而 `currentWorkspaceId` = **当前主视图那条会话所属的工作区**（`:850-851`），
#    `restoreSelection()`（`:925-947`）在 `saved.sessionId`（`dsh.sessions.current`，
#    `:761`）还在时更是**直接用它、根本不看 `recentWorkspace`**。
#    设备上恒有一条旧会话被自动恢复 ⇒ 只登记**不足以**让"新建会话"落在认领目录
#    （真机 09:40 实测：登记成功但新会话 cwd 仍是 `Download/`）。
#    **本端接受的已知局限**：本节只改"兜底"那一段优先级，改不动"当前会话所属工作区"
#    那一段。曾经的 host 侧新会话落点覆盖方案已按 57 号整体回退（见
#    `dsh-移植研究/57-回退钉子/简报.md`），本端**不**再改写客户端/host 的会话创建行为。
- insert:
    - id: dshm-workspace-claim
      name: '@deepseek-ai/dshm-workspace-claim'

# ⑩ 去 chmod 的文件写入后端（DSHM 自带插件，2026-10-03，44 号）
#
#    【缺口（根因，已是定论）】上游 `@deepseek-ai/dsh-fs-local` 的
#    `writeFileAtomic()`（lib/index.js:494-543）用"私有暂存目录 + 原子发布"实现写入，
#    前三步都要求 `chmod`：
#        mkdir(stagingDir, { mode: 448 })      // 0o700
#        chmod(stagingDir, 448)                // ← 鸿蒙 hmdfs 公共目录在这一句 EPERM
#        open(tempPath, "wx", 384)             // 0o600
#        handle.chmod(384)                     // ← 同类调用
#        … if (mode !== void 0) handle.chmod(mode); rename(tempPath, absolutePath)
#    真机逐字（会话 cwd = `Download/com.dshm.dshclient`）：
#        Error: EPERM: operation not permitted, chmod
#        '/storage/Users/currentUser/Download/com.dshm.dshclient/.手测-01.txt.<pid>.<uuid>.tmpdir'
#    ⇒ 只要"落盘"这一步依赖 chmod，agent 往用户可见工作区写文件就**永远**失败。
#
#    【为什么换 ctx.fs 后端是合法插入点】上游把 `ctx.fs` 明确设计成可替换契约：
#    `@deepseek-ai/dsh-fs-sandbox` 头注逐字写着 "Registers as `ctx.fs`
#    （loading it INSTEAD OF `dsh-fs-local` is the whole swap）"。本端 profile 实际
#    注册 `ctx.fs` 的就是 dsh-base 的 `fs-sandbox` 行 ⇒ 把那一行停用、换成本插件，
#    **模型可见的工具集（read/write/edit）一个字不改**，`fs/*` 策略瀑布（fs/write-intent、
#    fs/edit-intent、fs/observed 全在工具层发射）也不改。
#
#    【本行做什么】`@deepseek-ai/dshm-fs-write-nonchmod`（源码
#    hostcore/plugins/dshm-fs-write-nonchmod/，由 tools/pack-core.mjs 的
#    embedDshmToolPackages() 放进核心树 node_modules）`extends SandboxedFileSystem`，
#    **只重写 `writeText` / `editText` 的落盘一步**，改用 31 号探针实测放行的组合：
#        open(temp,'w'[,mode]) → writeFile → close → rename(temp, target)   （同目录内改名）
#    **不用 chmod**（实测 EPERM）；`link` 不用（沙箱禁）。路径封闭
#    （`checkedTarget`）、per-target 锁（`withLock`）、版本守卫
#    （`FS_STALE_VERSION` / `FS_NOT_OBSERVED`）、`probe`/`readTextForDiff`/`readForEdit`/
#    `applyLiteralEdit` 与返回结构全部与上游逐字同形（对照表见
#    `44-写入去chmod/简报.md` §契约对照）。
#
#    【如实登记的语义差异】① 暂存件是**同目录隐藏文件**（`.名.pid.uuid.partial`）而非上游那种
#    私有暂存**目录**：上游靠目录 0o700 + 文件 0o600 保护中间态，而那两步都要 `chmod`（端侧
#    EPERM）⇒ 改为同目录隐藏文件 + `rename`（`rename` 会把临时件的 mode 带过去，所以覆写时
#    把**目标既有 mode** 交给 `open`）；② `createIfAbsent` 的 no-clobber 从"发布期"降级为
#    "锁内检查期"（仅"进程外并发创建者"这一个窗口）；③ `fsync` 失败不再判写入失败（只打
#    stderr 警告）；④ 更新既有文件时权限位反而更准（`rename` 前把目标 mode 交给 `open`）。
#    【2026-10-05 更正】本节原先写"不用 rename（未证实）"+"就地写**非原子**"——与实现相反：
#    现实现用 `.partial` + `rename`，**是原子发布**（见 `lib/fsio-nochmod.js:22-33` 文件头）。
#
#    【怎么关掉】把下面两处删掉（`fs-sandbox` 的 disabled 行 + 本 insert 行）+
#    pack-core 的 DSHM_PLUGIN_PACKAGES 里那一项，即完全回到上游 `dsh-fs-sandbox`。
#    只想临时回退：在用户层 `$DSH_HOME/cordis.patch.yml` 写
#    `- id: fs-write-nonchmod` + `disabled: true` 并给 `fs-sandbox` 写 `disabled: false`。
#
#    【恢复条件】上游若把 `writeFileAtomic()` 的 chmod 去掉（或让 chmod 失败可容忍），
#    删掉下面两处即可。
- id: fs-sandbox
  disabled: true
- insert:
    - id: fs-write-nonchmod
      name: '@deepseek-ai/dshm-fs-write-nonchmod'

# ⑪ WebSocket 心跳阈值（DSHM，2026-10-03 加入 → 2026-10-04 回退，当前**不生效**）
#
#    【现状】下面那行 `typert-gateway` 的 config **已删除**，回到上游默认：
#      · `@deepseek-ai/dsh-api-gateway/lib/index.js:551 DEFAULT_WEBSOCKET_HEARTBEAT_INTERVAL_MS = 2e3`
#        （Host 每 2 秒向每个 WebSocket 客户端 `ping()`）；
#      · `:172 MAX_MISSED_HEARTBEATS = 2`；`:236-253` 每轮**先判 `missed >= 2` 再自增**
#        ⇒ 判死发生在第 3 个周期，默认 `3 × 2 秒 ≈ 6 秒` 收掉不回 Pong 的连接
#        （`:209-211` 收到 Pong 清零）。
#
#    【当初为什么加】按上游 `README.zh.md:89`「部署的事件循环或网络可能停顿超过该间隔，
#    必须调大」，把容忍度抬到 `2 × 30 = 60 秒`。当时读代码得到的关键事实是：判死发生在
#    自增之前 ⇒ 实际回收时刻是 `3 × interval`，改后是 **~90 秒**，不是注释里写的 60 秒。
#
#    【为什么回退】
#      ① 支撑它的现场读数（`docs/review-report-2026-09-29.md:288` 4-H1 的"断开成对出现、
#         间隔 6 秒上下"）出自 `connection/src/main/ets/**` 这套自研连接层，而同一份报告
#         `:39` 已认定该层在生产入口**不可达** ⇒ 它测的不是本 `typert-gateway` 这条连接。
#         2026-10-03 真机统计 `IN-UPGRADE GET /api/remote.mux`：09-27→10-03 共 85 次，
#         间隔中位数 304.7 s、最大 ≈45.9 h（挂起/息屏整段），全期只有一个 < 10 s（2.3 s）
#         ⇒ 该症状本机未复现。**本行从来不是"已观测缺陷的修复"，只是预防性加固。**
#      ② 它把**半死连接的回收窗口从 ~6 秒拉到 ~90 秒**，而"启动后一两分钟什么都慢、
#         之后突然全好"正是这个形态；登录/模型选择/插件市场/插件预览四个症状都走这条 mux
#         连接 ⇒ 这是这条路径上我们唯一的改动，先复归上游默认，再谈别的原因。
#      ③ 恢复上游默认=恢复首版行为，也让将来追平上游时少一处自定义。
#
#    【恢复条件】若真机复现"默认 6 秒回收导致重连风暴"，再按 `README.zh.md:89` 调大，
#    并把那一次的现场读数一并写在这里（不要只留推论）。

# ⑫ 侧栏 Office 文档预览改走系统预览窗（DSHM 自带插件，2026-10-04）
#
#    【缺口（根因，已是定论）】侧栏文档预览的"选哪个实现"在
#    `@deepseek-ai/dsh-client-ui-sidebar-documentpreview/lib/client.js:604-618`：
#    `candidates = matchingDocumentPreviews(definitions, file.path)`、`selected = candidates[0]`；
#    排序键（`:286-293`）是 `right.rank - left.rank || right.length - left.length ||
#    left.order - right.order`，其中 `rank = definition.priority === "builtin" ? 0 : 1`（`:291`）
#    ⇒ **一个 priority 非 builtin 的同后缀实现，一定排在内置实现前面。**
#
#    而内置 office 实现（`:5639-5699`，id `…/office`，`extensions = ["doc","docx","ppt","pptx"]`）
#    的读取函数是**恒 reject 的桩**：`:5652 let read = unavailable;`，只有
#    `:5700 ctx.inject(["remote","remote.officeToPdf","remote.workspaceFiles"], …)` 完备
#    之后才会被换成真实现。而 `remote.officeToPdf` 的宿主提供者
#    `@deepseek-ai/libreoffice-kit`：`lib/index.js:1267 resolveEngine()` 的 `platformTarget()`
#    （`:1241-1246`）只认 darwin / win32 / linux，`:1288` 对其它宿主直接
#        throw new Error(`Unsupported LibreOfficeKit host: ${platform}-${arch}`)
#    ⇒ 在 **openharmony-arm64 上结构性不可达**（真机 `node-output.log` 里 office 相关标识符 0 命中，
#    `dsh-office-to-pdf` 这条 host 路由根本没被加载）。
#
#    后果有两层，两层都在真机复现过：
#    ① 用户看到 zh 字典 `:5112` 那句
#       「Office 预览不可用。请在运行 DeepSeek Harness 的主机上启用文档预览服务。」；
#    ② 更长的时间里是**「一直渲染中」**——因为内置实现用的是 `loading: "renderer"`（`:5661`），
#       而 renderer 模式下正文只在 `content !== void 0` 时才渲染（`:749-785` 的 content useMemo；
#       `:970` 的转圈又要 `mode !== "renderer"`），桩永远不产出内容 ⇒ 正文区长期空转。
#
#    【为什么不是改上游、也不是加配置项】内置 office 的 `read` 唯一来源是
#    `remote.officeToPdf`，而该服务在端侧没有任何可接受的宿主实现；把 LibreOfficeKit 搬到
#    openharmony-arm64 不是本仓库可控范围（要一份能在这台设备上跑的 LibreOffice 引擎）。
#    端侧本来就有**系统级**的 Office 预览能力（`PreviewKit`，syscap
#    `SystemCapability.FileManagement.FilePreview.Core`，2in1 形态在
#    `sdk/default/hms/ets/api/device-define/2in1-hmos.json` 里具备），已经由
#    `platform/src/main/ets/system/FilePreview.ets` + `WebApp.ets` 的 `openFilePreview` 桥
#    接到 Web 侧 ⇒ 正确做法是让侧栏**认领**这四个后缀、正文与工具栏都指向那个桥。
#
#    【本行做什么】`@deepseek-ai/dshm-office-system-preview`（源码
#    hostcore/plugins/dshm-office-system-preview/，由 tools/pack-core.mjs 的
#    embedDshmToolPackages() 放进核心树 node_modules）是一个**纯客户端**插件：
#    host 半边是空 `apply()`（照上游 `@deepseek-ai/dsh-client-ui-open-in-app/lib/index.js`
#    的 481 B 样板，注释里写明"空 apply 只是为了让插件出现在 host cordis.yml / Loader 里，
#    浏览器半边走 exports["./client"]，由 package.json 的 dsh.client 声明被发现"）。
#    浏览器半边（`lib/client.js`）做四件事：
#      · `ctx.documentPreviews.register({ id: "…/office", extensions: ["doc","docx","ppt","pptx"],
#        binaryExtensions: 同上, priority: "extension", loading: "bytes-complete", wrap: false })`
#        —— 只认领这四个后缀，用非 builtin 的 priority 顶掉内置桩；
#      · 正文槽 `sidebar.right.tab.document` 注册面板组件（读
#        `useResource(props.resourceAddress).value?.absolutePath`，与上游 `MarkdownBody`
#        `:1554-1555` 同一取法），显示文件名/大小 + 一个「系统预览」按钮；
#      · 侧栏标题栏的 `sidebar.right.tab.document.actions` 与空态失败块的
#        `sidebar.right.tab.document.unpreviewable` 各注册一个同款按钮（这两个 list 槽由上游
#        `TextPreview` 的父条目声明，见 `:6827-6846` —— **本插件不重复声明**，否则
#        `dsh-client-ui-slots/lib/index.js:191-194` 会抛 `slot "…" is already declared`）；
#      · 三个按钮都调 ArkTS 桥 `globalThis.__DSHM_BRIDGES__.openFilePreview(absolutePath)`
#        （`WebApp.ets:1251-1266` 的返回契约：`'ok'` 成功 / `'empty'` / `'nouri'`），
#        由 `platform` 的 `openSystemPreview()` 弹系统预览窗。
#
#    【为什么 loading 必须是 bytes-complete】renderer 模式要求正文自己回执
#    （`actions.rendered(tabId, revision, version)`，`:1331-1336`，且非 renderer 模式直接早退），
#    而 `content === void 0` 时正文**既不转圈也不渲染槽**（`:970` / `:971`）⇒ 空白。
#    `bytes-complete` 则由侧栏自己走 `readBytes(…, {}, signal)` 整读一遍
#    （上限 `maxFileBytes = 32 MiB`，`@deepseek-ai/dsh-api-workspace-files/lib/index.js:385`），
#    读完 `actions.complete()` 让 `content = {kind:"bytes", …}`，正文面板立刻有内容；
#    读失败（如超 32 MiB 抛 `workspace-file/too-large`）则落进 `:996-1017` 的空态失败块，
#    而 `emptyFailureRecourse("workspace-file/too-large") === "open"`（`:173-181`）
#    ⇒ `.unpreviewable` 槽里的按钮仍然渲染。两条路径都给得出入口。
#
#    【为什么不认领 xls/xlsx/csv/tsv】内置 Excel 实现（`:5853-5880`）是**纯客户端**的
#    （`LazyExcelBody` → `lib/client.excel.js`），端侧本来就正常；本插件一旦认领就会把它顶掉，
#    而本插件并不重新实现表格渲染 ⇒ 那是**功能退化**。
#
#    【边界】· 不改上游 dsh 一个字节、不新增任何权限、不碰任何既有目录；
#    · **绝不阻断启动**：`apply()` 只做注册，注册全部包在 `ctx.effect` 里由 cordis 回收；
#      桥在**点击时**才现取（非 DSHM 环境 / 页面重载后都不会在模块求值期拿到失效引用）；
#    · locale 用自有 ns `dshmOfficeSystemPreview`（上游 `sidebarOffice` 已注册，
#      复用会在 `dsh-client-locale/lib/client.js:1387-1412` 抛
#      `locale namespace "…" already has locale "…"`）；
#    · 注入的 `<style>` 的 `data-plugin` 写本插件包名（`dsh-client-modules/lib/client.js:194-197`
#      的 `removeOwnedStyles(id)` 按 `style[data-plugin=<模块 id>]` 精确摘除）。
#
#    【怎么关掉】删掉下面这个 insert 行 + pack-core 的 DSHM_PLUGIN_PACKAGES 里那一项，
#    即完全回到上游内置 office 实现（也就是回到"Office 预览不可用"那句提示）。
#    只想临时回退：在用户层 `$DSH_HOME/cordis.patch.yml` 写
#    `- id: dshm-office-system-preview` + `disabled: true`。
#
#    【恢复条件】上游若给 `remote.officeToPdf` 补上 openharmony 宿主实现（或把侧栏 office
#    预览改成不依赖宿主渲染），删掉下面这个 insert 行 + pack-core 里那一项即可。
- insert:
    - id: dshm-office-system-preview
      name: '@deepseek-ai/dshm-office-system-preview'
